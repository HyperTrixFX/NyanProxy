  provider: ollama   # ollama 或 deepseek
  enable: false
  memory:
    enable: true
    extract-before-expire-seconds: 600   # Redis 会话剩余 TTL <= 10 分钟时提取长期记忆
    scan-interval-ms: 60000
    max-sessions-per-scan: 20

ollama:
  url: http://localhost:11434/api/chat
  model: qwen3.5:9b

deepseek:
  url: https://api.deepseek.com/chat/completions
  api-key: sk-1111111111111111111111111111111
  model: deepseek-v4-flash



