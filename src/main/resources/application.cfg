#两个数据库都要配置,不然用不了!
spring:
  #MySQL
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://localhost:3306/nyanid?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  data:
    #Redis
    redis:
      host: localhost
      database: 0
      password: ${REDIS_PASSWORD:}
      port: 6379
      repositories:
        enabled: false
  #邮件服务,必须配置!
  mail:
    host: smtp.yeah.net #SMTP 服务器地址
    port: 25 #SMTP 服务器端口
    username: ${MAIL_USERNAME:} #邮箱名
    password: ${MAIL_PASSWORD:} #邮箱密码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: false

#服务器配置
server:
  port: 8080
  address: localhost
  ssl:
    certificate: xxxxxx.xxx.crt
    certificate-private-key: xxxxxx.xxx.key
    trust-certificate: root_bundle.crt

#NyanID配置
NyanidSetting:
  MicrosoftLogin:
    appid: ""
    secretkey: ""
    tenant: ""
    redirect_uri: ""
  allowedOriginPatterns: "https://*.*.*:*" #匹配所有 example.com 域名及其端口号
  EnableProxy: false #是否启用Minecraft Proxy
  EnableCommand: true #是否启用控制台指令
  EnableUserRegister: true #是否启用用户注册
  TurnstileSecretKey: ${TURNSTILE_SECRET:}
  TurnstileSecretSiteKey: ${TURNSTILE_SITE:}
  # IP访问限制(仅适用于authserver)
  MAX_REQUESTS_PER_SECOND: 7 #IP访问频率限制
  TIME_FRAME_IN_MILLISECONDS: 9500 #IP访问时间间隔
  encryptionKey: ${NYANID_ENCRYPTION_KEY:} #用户密码加密密钥(改为从环境变量注入,勿硬编码)
  HOST: "http://xxxx.xx:8080" #前端域名
